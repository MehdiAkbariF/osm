<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقشه اختصاصی ایران - مدیریت لجستیک و انبارها (v2)</title>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: Tahoma, sans-serif; }
        #map { width: 100%; height: 100%; }

        #search-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            width: 340px;
        }
        #search-row { display: flex; width: 100%; gap: 6px; }
        #search-input {
            flex-grow: 1;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }
        #search-button {
            padding: 10px 16px;
            background: #ffa042;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            font-family: inherit;
        }
        #search-button:hover { background: #e07a1b; }

        #category-filter-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 6px;
            background: white;
            padding: 6px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .cat-btn {
            padding: 8px 14px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .cat-btn:hover { background: #ffa042; color: white; border-color: #ffa042; }
        .cat-btn.active { background: #ffa042; color: white; border-color: #ffa042; }
        
        #search-results { max-height: 200px; overflow-y: auto; margin-top: 6px; background: white; border-radius: 6px; }
        
        #info-box {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.6;
            max-width: 280px;
            pointer-events: none;
        }

        #address-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 13px;
            max-width: 450px;
            direction: rtl;
            text-align: right;
            pointer-events: auto;
            border-right: 4px solid #ffa042;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        #address-box strong { color: #ffa042; display: block; margin-bottom: 8px; font-size: 13px; }
        #address-text { color: #fff; line-height: 1.6; font-size: 12px; display: block; }
        .address-coord { font-size: 10px; color: #aaa; margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.2); direction: ltr; text-align: left; }
        .close-address { position: absolute; top: 8px; left: 12px; cursor: pointer; font-size: 16px; color: #aaa; transition: color 0.2s; }
        .close-address:hover { color: #ffa042; }

        .result-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; font-size: 12px; text-align: right; }
        .result-item:hover { background: #f7f7f7; }
        .result-distance { font-size: 10px; color: #ffa042; margin-right: 8px; }
        
        #route-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px;
            font-size: 12px;
            max-width: 380px;
            direction: rtl;
            border-right: 4px solid #ffa042;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="search-container">
        <div id="search-row">
            <input type="text" id="search-input" placeholder="جستجوی مکان بر اساس API v2..." />
            <button id="search-button">جستجو</button>
        </div>
        <div id="search-results"></div>
    </div>

    <div id="category-filter-container">
        <button class="cat-btn" data-store-id="1">🏢 انبارهای فروشگاه ۱</button>
        <button class="cat-btn" data-store-id="2">🏢 انبارهای فروشگاه ۲</button>
        <button class="cat-btn" data-store-id="3">🏢 انبارهای فروشگاه ۳</button>
    </div>

    <div id="info-box">
        <b>✨ نقشه اختصاصی یودکچی (نسخه ۲)</b><br/>
        ✅ کلیک چپ: تعیین مبدا (سبز) و مقصد (قرمز) برای مسیریابی جاده‌ای<br/>
        ✅ کلیک راست: دریافت آدرس معکوس نقطه از پایتون<br/>
        <span style="color:#ffa042;">🔍 زوم بیشتر = جزئیات دقیق‌تر برداری</span>
    </div>

    <div id="address-box" style="display: none;">
        <span class="close-address" onclick="document.getElementById('address-box').style.display='none';">✕</span>
        <strong>📍 آدرس دقیق مکان (v2)</strong>
        <div id="address-text">در حال دریافت آدرس...</div>
        <div id="address-coords" class="address-coord"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script>
        maplibregl.setRTLTextPlugin(
            'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.js',
            null,
            true
        );

        const MAP_API_KEY = "yk_live_ctrFT2gB-IVAsPNP0q_QsX1VTml6qXVTaSDhkOcv630";
        const vectorStyleUrl = `http://localhost:8000/api/v2/map/styles/default?api_key=${MAP_API_KEY}`;
        
        let map;
        let searchMarker = null;
        let startCoords = null;
        let endCoords = null;
        let startMarker = null;
        let endMarker = null;
        let warehouseMarkers = [];

        // الف) بارگذاری غیرهمزمان استایل رسمی شما و انطباق پویای سورس‌ها و فونت‌ها به نسخه ۲
        async function initMap() {
            try {
                const response = await fetch(vectorStyleUrl, {
                    headers: { 'X-API-Key': MAP_API_KEY }
                });
                const style = await response.json();

                // ۱. هدایت تمام سورس‌های مجزای استایل شما به تک‌ایندپوینت پروکسی شده برداری v2 پایتون
                const v2TileUrl = "http://localhost:8000/api/v2/map/tiles/{z}/{x}/{y}";
                
                style.sources = {
                    "iran_polygons": {
                        "type": "vector",
                        "tiles": [v2TileUrl]
                    },
                    "iran_lines": {
                        "type": "vector",
                        "tiles": [v2TileUrl]
                    },
                    "iran_points": {
                        "type": "vector",
                        "tiles": [v2TileUrl]
                    }
                };

                // ۲. تصحیح فرمت آدرس فونت‌های محلی پورت 3000 مارتین طبق ساختار پیش‌فرض default.json شما
                style.glyphs = "http://localhost:3000/font/{fontstack}/{range}";

                // ۳. 🔴 اصلاح حیاتی فونت‌ها: حذف ترکیب دوگانه جهت جلوگیری از خطای ۴۰۴ در مارتین
                // تمام لایه‌ها را ملزم می‌کنیم فقط از فونت زیبای فارسی "Vazirmatn Thin" استفاده کنند.
                if (style.layers) {
                    style.layers.forEach(layer => {
                        if (layer.layout && layer.layout["text-font"]) {
                            layer.layout["text-font"] = ["Vazirmatn Thin"];
                        }
                    });
                }

                // ۴. مقداردهی نقشه با استایل بهینه‌سازی شده شما
                map = new maplibregl.Map({
                    container: 'map',
                    center: [51.404, 35.715], // لود مرکز تهران
                    zoom: 11,
                    style: style
                });

                map.addControl(new maplibregl.NavigationControl());
                
                setupMapEvents();

            } catch (error) {
                console.error("خطا در بارگذاری اولیه و تنظیم تایل‌های نقشه:", error);
            }
        }

        function buildCleanAddress(item) {
            if (typeof item === 'string') return item;
            if (item.address) return item.address;
            return item.display_name || 'آدرس نامشخص';
        }
        
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * dLon/2;
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function setupMapEvents() {
            map.on('click', async (e) => {
                const coords = [e.lngLat.lng, e.lngLat.lat];
                if (!startCoords) {
                    startCoords = coords;
                    startMarker = new maplibregl.Marker({ color: '#2e7d32' }).setLngLat(startCoords).addTo(map);
                } else if (!endCoords) {
                    endCoords = coords;
                    endMarker = new maplibregl.Marker({ color: '#d32f2f' }).setLngLat(endCoords).addTo(map);
                    await calculateRoute(startCoords, endCoords, true);
                } else {
                    resetRouting();
                    startCoords = coords;
                    startMarker = new maplibregl.Marker({ color: '#2e7d32' }).setLngLat(startCoords).addTo(map);
                }
            });

            const addressBox = document.getElementById('address-box');
            const addressText = document.getElementById('address-text');
            const addressCoords = document.getElementById('address-coords');

            map.on('contextmenu', async (e) => {
                e.preventDefault();
                const lng = e.lngLat.lng;
                const lat = e.lngLat.lat;
                
                addressBox.style.display = 'block';
                addressText.innerHTML = 'در حال دریافت آدرس...';
                addressCoords.innerHTML = `مختصات: ${lng.toFixed(6)} , ${lat.toFixed(6)}`;
                
                try {
                    const reverseUrl = `http://127.0.0.1:8000/api/v2/map/reverse?lat=${lat}&lon=${lng}`;
                    const reverseResponse = await fetch(reverseUrl, {
                        headers: { 'X-API-Key': MAP_API_KEY }
                    });
                    const data = await reverseResponse.json();
                    
                    if (!data) {
                        addressText.innerHTML = 'آدرسی برای این نقطه یافت نشد.';
                        return;
                    }
                    addressText.innerHTML = typeof data === 'string' ? data : (data.address || data.display_name || 'نامشخص');
                } catch (error) {
                    console.error('خطا در آدرس‌یابی معکوس:', error);
                    addressText.innerHTML = 'خطا در ارتباط با سرور آدرس‌یابی پایتون.';
                }
            });
        }

        async function executeSearch() {
            const query = document.getElementById('search-input').value.trim();
            const resultsContainer = document.getElementById('search-results');
            if (!query) { resultsContainer.innerHTML = ''; return; }
            
            resultsContainer.innerHTML = '<div class="result-item">در حال جستجو...</div>';
            
            try {
                let url = `http://127.0.0.1:8000/api/v2/map/search?q=${encodeURIComponent(query)}`;
                const response = await fetch(url, { headers: { 'X-API-Key': MAP_API_KEY } });
                const data = await response.json();
                
                displaySearchResults(data);
                
                if (!data || data.length === 0) {
                    resultsContainer.innerHTML = `<div class="result-item">مکانی برای "${query}" یافت نشد.</div>`;
                }
            } catch (error) {
                console.error("خطا در جستجو:", error);
                resultsContainer.innerHTML = '<div class="result-item" style="color:red;">خطا در اتصال به پلاتفرم نقشه!</div>';
            }
        }

        function displaySearchResults(results) {
            const resultsContainer = document.getElementById('search-results');
            resultsContainer.innerHTML = '';
            
            const items = Array.isArray(results) ? results : [results];
            if (items.length === 0 || !items[0]) return;

            const center = map.getCenter();
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                
                const lat = item.lat ? parseFloat(item.lat) : center.lat;
                const lon = item.lon ? parseFloat(item.lon) : center.lng;
                
                const distance = calculateDistance(center.lat, center.lng, lat, lon);
                const formattedAddress = buildCleanAddress(item);
                
                div.innerHTML = `${formattedAddress} <span class="result-distance">(${distance.toFixed(1)} کیلومتر)</span>`;
                div.onclick = () => {
                    map.flyTo({ center: [lon, lat], zoom: 15, essential: true });
                    if (searchMarker) searchMarker.remove();
                    searchMarker = new maplibregl.Marker({ color: '#ffa042' }).setLngLat([lon, lat]).addTo(map);
                    resultsContainer.innerHTML = '';
                };
                resultsContainer.appendChild(div);
            });
        }
        
        document.getElementById('search-button').addEventListener('click', executeSearch);
        document.getElementById('search-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') executeSearch(); });

        async function calculateRoute(start, end, showPanel = true) {
            const url = `http://127.0.0.1:8000/api/v2/map/route`;
            const payload = {
                start_lat: parseFloat(start[1]),
                start_lon: parseFloat(start[0]),
                end_lat: parseFloat(end[1]),
                end_lon: parseFloat(end[0])
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': MAP_API_KEY
                    },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                
                if (!data || !data.routes || data.routes.length === 0) {
                    alert('مسیر جاده‌ای بین این دو نقطه یافت نشد!');
                    return null;
                }

                const steps = data.routes[0].legs[0].steps || [];
                const routeStreets = [];
                steps.forEach((step, index) => {
                    if (step.name) {
                        routeStreets.push({
                            order: index + 1,
                            street: step.name,
                            distance: step.distance,
                            duration: step.duration,
                            maneuver: step.maneuver?.type || 'continue'
                        });
                    }
                });

                const lastStreet = routeStreets[routeStreets.length - 1];
                const totalDistance = (data.routes[0].distance / 1000).toFixed(1);
                const totalMinutes = Math.floor(data.routes[0].duration / 60);

                if (showPanel) {
                    let panelHtml = `
                        <div style="direction: rtl;">
                            <div style="border-bottom: 1px solid #ffa042; padding-bottom: 8px; margin-bottom: 8px;">
                                <b>🚗 جزئیات مسیریابی هوشمند (v2)</b><br/>
                                📏 فاصله جاده‌ای: ${totalDistance} کیلومتر<br/>
                                ⏱️ زمان سفر تقریبی: ${totalMinutes} دقیقه
                            </div>
                            <div style="margin-bottom: 8px;">
                                <b>📍 معبر مقصد:</b> <span style="color:#ffa042;">${lastStreet?.street || 'ثبت نشده'}</span>
                            </div>
                        </div>
                    `;
                    showRoutePanel(panelHtml);
                }

                const routeGeometry = data.routes[0].geometry;
                if (map.getSource('route')) {
                    map.getSource('route').setData(routeGeometry);
                } else {
                    map.addSource('route', { type: 'geojson', data: routeGeometry });
                    map.addLayer({
                        id: 'route-line', type: 'line', source: 'route',
                        layout: { 'line-join': 'round', 'line-cap': 'round' },
                        paint: { 'line-color': '#ffa042', 'line-width': 6, 'line-opacity': 0.85 }
                    });
                }
            } catch (error) {
                console.error("خطا در مسیریابی:", error);
                alert("امکان برقراری ارتباط با سرور مسیریابی وجود ندارد!");
            }
        }

        function resetRouting() {
            startCoords = null; endCoords = null;
            if (startMarker) startMarker.remove();
            if (endMarker) endMarker.remove();
            if (map.getLayer('route-line')) map.removeLayer('route-line');
            if (map.getSource('route')) map.removeSource('route');
            removeRoutePanel();
        }

        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const storeId = btn.getAttribute('data-store-id');
                
                if (btn.classList.contains('active')) {
                    btn.classList.remove('active');
                    clearWarehouseMarkers();
                    return;
                }

                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                try {
                    const url = `http://127.0.0.1:8000/api/v2/warehouses/${storeId}`;
                    const response = await fetch(url, { headers: { 'X-API-Key': MAP_API_KEY } });
                    const data = await response.json();

                    clearWarehouseMarkers();

                    if (!data || data.length === 0) {
                        alert("هیچ انباری برای این فروشگاه ثبت نشده است!");
                        return;
                    }

                    data.forEach(item => {
                        const popup = new maplibregl.Popup({ offset: 25 })
                            .setHTML(`
                                <div style="text-align: right; direction: rtl; font-family: Tahoma, sans-serif;">
                                    <b>🏢 انبار: ${item.name}</b><br/>
                                    📍 آدرس: ${item.address || 'ثبت نشده'}<br/>
                                    📞 تلفن تماس: ${item.phone || 'ثبت نشده'}
                                </div>
                            `);

                        const marker = new maplibregl.Marker({ color: '#1e88e5' })
                            .setLngLat([parseFloat(item.lon), parseFloat(item.lat)])
                            .setPopup(popup)
                            .addTo(map);

                        warehouseMarkers.push(marker);
                    });
                } catch (error) {
                    console.error("خطا در دریافت انبارها:", error);
                    alert("خطا در ارتباط با سرور دریافت اطلاعات انبارها!");
                }
            });
        });

        function clearWarehouseMarkers() {
            warehouseMarkers.forEach(marker => marker.remove());
            warehouseMarkers = [];
        }

        initMap();
    </script>
</body>
</html>
