<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقشه اختصاصی ایران - آدرس‌دهی و فیلتر هوشمند مکان‌ها</title>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: Tahoma, sans-serif; }
        #map { width: 100%; height: 100%; }

        #search-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            width: 340px;
        }
        #search-row { display: flex; width: 100%; gap: 6px; }
        #search-input {
            flex-grow: 1;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }
        #search-button {
            padding: 10px 16px;
            background: #ffa042;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            font-family: inherit;
        }
        #search-button:hover { background: #e07a1b; }
        
        .search-mode-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .mode-btn {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .mode-btn.active { background: #ffa042; color: white; }
        .mode-btn:not(.active) { background: #f0f0f0; color: #333; }
        .mode-btn:not(.active):hover { background: #e0e0e0; }

        /* نوار فیلتر سریع مکان‌ها (POI) در بالای نقشه */
        #category-filter-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 6px;
            background: white;
            padding: 6px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .cat-btn {
            padding: 8px 14px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .cat-btn:hover { background: #ffa042; color: white; border-color: #ffa042; }
        .cat-btn.active { background: #ffa042; color: white; border-color: #ffa042; }
        
        #search-results { max-height: 200px; overflow-y: auto; margin-top: 6px; background: white; border-radius: 6px; }
        
        #info-box {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.6;
            max-width: 280px;
            pointer-events: none;
        }

        #address-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 13px;
            max-width: 450px;
            direction: rtl;
            text-align: right;
            pointer-events: auto;
            border-right: 4px solid #ffa042;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        #address-box strong { color: #ffa042; display: block; margin-bottom: 8px; font-size: 13px; }
        #address-text { color: #fff; line-height: 1.6; font-size: 12px; display: block; }
        .address-coord { font-size: 10px; color: #aaa; margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.2); direction: ltr; text-align: left; }
        .close-address { position: absolute; top: 8px; left: 12px; cursor: pointer; font-size: 16px; color: #aaa; transition: color 0.2s; }
        .close-address:hover { color: #ffa042; }

        .result-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; font-size: 12px; text-align: right; }
        .result-item:hover { background: #f7f7f7; }
        .result-distance { font-size: 10px; color: #ffa042; margin-right: 8px; }
        
        #route-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px;
            font-size: 12px;
            max-width: 380px;
            direction: rtl;
            border-right: 4px solid #ffa042;
            pointer-events: auto;
        }

        .maplibregl-popup-content {
            font-family: Tahoma, sans-serif;
            font-size: 11px;
            direction: rtl;
            text-align: right;
            border-radius: 6px;
            padding: 10px 15px;
        }
    </style>
</head>
<body>

    <!-- باکس جستجوی چندحالته -->
    <div id="search-container">
        <div id="search-row">
            <input type="text" id="search-input" placeholder="جستجوی مکان..." />
            <button id="search-button">جستجو</button>
        </div>
        <div class="search-mode-buttons">
            <button id="mode-viewport-btn" class="mode-btn active">📍 جستجو در محدوده دید</button>
            <button id="mode-global-btn" class="mode-btn">🌍 جستجو در کل ایران</button>
        </div>
        <div id="search-results"></div>
    </div>

    <!-- نوار فیلتر سریع مکان‌ها (POI) در بالای نقشه -->
    <div id="category-filter-container">
        <button class="cat-btn" data-category="fuel">⛽ پمپ بنزین</button>
        <button class="cat-btn" data-category="atm">🏧 عابر بانک</button>
        <button class="cat-btn" data-category="hospital">🏥 بیمارستان</button>
        <button class="cat-btn" data-category="restaurant">🍔 رستوران</button>
    </div>

    <div id="info-box">
        <b>✨ نقشه اختصاصی یودکچی</b><br/>
        ✅ کلیک چپ: تعیین مبدا (سبز) و مقصد (قرمز) برای مسیریابی<br/>
        ✅ کلیک راست: دریافت آدرس دقیق نقطه<br/>
        <span style="color:#ffa042;">🔍 هرچه زوم کنید، جزئیات بیشتری می‌بینید</span>
    </div>

    <div id="address-box" style="display: none;">
        <span class="close-address" onclick="document.getElementById('address-box').style.display='none';">✕</span>
        <strong>📍 آدرس دقیق مکان</strong>
        <div id="address-text">در حال دریافت آدرس...</div>
        <div id="address-coords" class="address-coord"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script>
        maplibregl.setRTLTextPlugin(
            'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.js',
            null,
            true
        );

        const map = new maplibregl.Map({
            container: 'map',
            center: [51.404, 35.715],
            zoom: 12,
            style: {
                "version": 8,
                "name": "Advanced Iran Style",
                "glyphs": "http://127.0.0.1:3000/font/{fontstack}/{range}",
                "sources": {
                    "iran_polygons": {
                        "type": "vector",
                        "tiles": ["http://127.0.0.1:8000/api/v1/tiles/planet_osm_polygon/{z}/{x}/{y}"]
                    },
                    "iran_lines": {
                        "type": "vector",
                        "tiles": ["http://127.0.0.1:8000/api/v1/tiles/planet_osm_line/{z}/{x}/{y}"]
                    },
                    "iran_points": {
                        "type": "vector",
                        "tiles": ["http://127.0.0.1:8000/api/v1/tiles/planet_osm_point/{z}/{x}/{y}"]
                    }
                },
                "layers": [
                    { "id": "background", "type": "background", "paint": { "background-color": "#f4f1ea" } },
                    { "id": "residential-areas", "type": "fill", "source": "iran_polygons", "source-layer": "planet_osm_polygon", "filter": ["==", "landuse", "residential"], "paint": { "fill-color": "#e5e0d8", "fill-opacity": 0.9 } },
                    { "id": "parks-forests", "type": "fill", "source": "iran_polygons", "source-layer": "planet_osm_polygon", "filter": ["any", ["==", "leisure", "park"], ["==", "landuse", "forest"], ["==", "landuse", "grass"]], "paint": { "fill-color": "#d0e4cc" } },
                    { "id": "water-bodies", "type": "fill", "source": "iran_polygons", "source-layer": "planet_osm_polygon", "filter": ["any", ["==", "natural", "water"], ["==", "landuse", "reservoir"]], "paint": { "fill-color": "#aad3df" } },
                    { "id": "motorway-casing", "type": "line", "source": "iran_lines", "source-layer": "planet_osm_line", "filter": ["any", ["==", "highway", "motorway"], ["==", "highway", "trunk"]], "paint": { "line-color": "#e07a1b", "line-width": 4.5 } },
                    { "id": "motorway-core", "type": "line", "source": "iran_lines", "source-layer": "planet_osm_line", "filter": ["any", ["==", "highway", "motorway"], ["==", "highway", "trunk"]], "paint": { "line-color": "#ffa042", "line-width": 2.5 } },
                    { "id": "primary-casing", "type": "line", "source": "iran_lines", "source-layer": "planet_osm_line", "filter": ["any", ["==", "highway", "primary"], ["==", "highway", "secondary"]], "paint": { "line-color": "#d6a100", "line-width": 3.5 } },
                    { "id": "primary-core", "type": "line", "source": "iran_lines", "source-layer": "planet_osm_line", "filter": ["any", ["==", "highway", "primary"], ["==", "highway", "secondary"]], "paint": { "line-color": "#ffe082", "line-width": 2 } },
                    { "id": "minor-roads", "type": "line", "source": "iran_lines", "source-layer": "planet_osm_line", "filter": ["any", ["==", "highway", "residential"], ["==", "highway", "tertiary"], ["==", "highway", "service"]], "paint": { "line-color": "#ffffff", "line-width": 1.2 } },
                    { "id": "road-labels", "type": "symbol", "source": "iran_lines", "source-layer": "planet_osm_line", "filter": ["all", ["has", "name"], ["has", "highway"]], "layout": { "text-field": ["get", "name"], "text-font": ["Vazirmatn Thin", "Arial Regular"], "text-size": 11, "symbol-placement": "line" }, "paint": { "text-color": "#2c2c2c", "text-halo-color": "#ffffff", "text-halo-width": 1.5 } },
                    { "id": "poi-labels", "type": "symbol", "source": "iran_points", "source-layer": "planet_osm_point", "filter": ["has", "name"], "layout": { "text-field": ["get", "name"], "text-font": ["Vazirmatn Thin", "Arial Regular"], "text-size": 11, "symbol-placement": "point", "text-padding": 10 }, "paint": { "text-color": "#d32f2f", "text-halo-color": "#ffffff", "text-halo-width": 2 } }
                ]
            }
        });

        map.addControl(new maplibregl.NavigationControl());

        // ==========================================
        // توابع کمکی آدرس‌دهی هوشمند (ویژه باکس جستجو)
        // ==========================================
        function cleanSuburb(suburb) {
            if (!suburb) return '';
            return suburb.replace(' شهر تهران', '').replace('منطقه ', 'منطقهٔ ');
        }

        function buildCleanAddress(addressData) {
            if (!addressData || !addressData.address) {
                return addressData?.display_name || 'آدرسی یافت نشد';
            }
            const addr = addressData.address;
            const parts = [];
            if (addr.state) parts.push(addr.state); 
            if (addr.county && addr.county !== addr.state) parts.push(addr.county);
            if (addr.city && addr.city !== addr.county) parts.push(addr.city);
            if (addr.suburb) {
                const clean = cleanSuburb(addr.suburb);
                if (clean && !parts.includes(clean)) parts.push(clean);
            }
            if (addr.neighbourhood && addr.neighbourhood !== addr.suburb) parts.push(addr.neighbourhood);
            if (addr.road && !parts.includes(addr.road)) parts.push(addr.road);
            
            const finalParts = [];
            for (const part of parts) {
                if (part && part !== '' && !finalParts.includes(part)) finalParts.push(part);
            }
            return finalParts.join('، ');
        }

        // ==========================================
        // لایه منطق موتور جستجوی چندحالته متصل به پایتون ( FastAPI - پورت 8000 )
        // ==========================================
        let searchMarker = null;
        let currentSearchMode = 'viewport';
        
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }
        
        async function executeSearch() {
            const query = document.getElementById('search-input').value.trim();
            const resultsContainer = document.getElementById('search-results');
            if (!query) { resultsContainer.innerHTML = ''; return; }
            
            resultsContainer.innerHTML = '<div class="result-item">در حال جستجو...</div>';
            
            try {
                let url = `http://127.0.0.1:8000/api/v1/search?q=${encodeURIComponent(query)}`;
                
                if (currentSearchMode === 'viewport') {
                    const bounds = map.getBounds();
                    const viewbox = `${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()},${bounds.getSouth()}`;
                    url += `&mode=viewport&viewbox=${viewbox}`;
                } else {
                    url += `&mode=global`;
                }

                const response = await fetch(url);
                const data = await response.json();
                displaySearchResults(data);
                
                if (data.length === 0) {
                    const modeText = currentSearchMode === 'viewport' ? 'محدوده دید' : 'کل ایران';
                    resultsContainer.innerHTML = `<div class="result-item">مکانی برای "${query}" در ${modeText} یافت نشد.</div>`;
                }
            } catch (error) {
                console.error("خطا در جستجو:", error);
                resultsContainer.innerHTML = '<div class="result-item" style="color:red;">خطا در اتصال به پلاتفرم اختصاصی نقشه!</div>';
            }
        }

        function displaySearchResults(results) {
            const resultsContainer = document.getElementById('search-results');
            resultsContainer.innerHTML = '';
            if (results.length === 0) return;
            const center = map.getCenter();
            results.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                const lat = parseFloat(item.lat);
                const lon = parseFloat(item.lon);
                const distance = calculateDistance(center.lat, center.lng, lat, lon);
                const formattedAddress = buildCleanAddress(item);
                div.innerHTML = `${formattedAddress}<span class="result-distance">(${distance.toFixed(1)} کیلومتر)</span>`;
                div.onclick = () => {
                    map.flyTo({ center: [lon, lat], zoom: 15, essential: true });
                    if (searchMarker) searchMarker.remove();
                    searchMarker = new maplibregl.Marker({ color: '#ffa042' }).setLngLat([lon, lat]).addTo(map);
                    resultsContainer.innerHTML = '';
                };
                resultsContainer.appendChild(div);
            });
        }

        document.getElementById('mode-viewport-btn').addEventListener('click', () => {
            currentSearchMode = 'viewport';
            document.getElementById('mode-viewport-btn').classList.add('active');
            document.getElementById('mode-global-btn').classList.remove('active');
            if (document.getElementById('search-input').value.trim()) executeSearch();
        });
        
        document.getElementById('mode-global-btn').addEventListener('click', () => {
            currentSearchMode = 'global';
            document.getElementById('mode-global-btn').classList.add('active');
            document.getElementById('mode-viewport-btn').classList.remove('active');
            if (document.getElementById('search-input').value.trim()) executeSearch();
        });
        
        document.getElementById('search-button').addEventListener('click', executeSearch);
        document.getElementById('search-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') executeSearch(); });

        // ==========================================
        // مسیریابی با کلیک چپ (OSRM)
        // ==========================================
        let startCoords = null;
        let endCoords = null;
        let startMarker = null;
        let endMarker = null;

        function removeRoutePanel() {
            const panel = document.getElementById('route-panel');
            if (panel) panel.remove();
        }

        function showRoutePanel(html) {
            removeRoutePanel();
            const panel = document.createElement('div');
            panel.id = 'route-panel';
            panel.innerHTML = html + `<div style="text-align: left; margin-top: 8px;"><span onclick="removeRoutePanel()" style="cursor:pointer; font-size:10px; color:#666;">بستن ✕</span></div>`;
            document.body.appendChild(panel);
        }

        async function calculateRoute(start, end, showPanel = true) {
            const url = `http://127.0.0.1:5000/route/v1/driving/${start[0]},${start[1]};${end[0]},${end[1]}?overview=full&geometries=geojson&steps=true`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.code !== 'Ok') {
                    alert('مسیر جاده‌ای پیدا نشد!');
                    return null;
                }

                const steps = data.routes[0].legs[0].steps;
                const routeStreets = [];
                steps.forEach((step, index) => {
                    if (step.name && step.name !== '') {
                        routeStreets.push({
                            order: index + 1,
                            street: step.name,
                            distance: step.distance,
                            duration: step.duration,
                            maneuver: step.maneuver?.type || 'continue'
                        });
                    }
                });

                const lastStreet = routeStreets[routeStreets.length - 1];
                const totalDistance = (data.routes[0].distance / 1000).toFixed(1);
                const totalMinutes = Math.floor(data.routes[0].duration / 60);
                const totalSeconds = Math.floor(data.routes[0].duration % 60);

                if (showPanel) {
                    let panelHtml = `
                        <div style="direction: rtl;">
                            <div style="border-bottom: 1px solid #ffa042; padding-bottom: 8px; margin-bottom: 8px;">
                                <b>🚗 خلاصه مسیر</b><br/>
                                📏 فاصله: ${totalDistance} کیلومتر<br/>
                                ⏱️ زمان: ${totalMinutes} دقیقه و ${totalSeconds} ثانیه
                            </div>
                            <div style="margin-bottom: 8px;">
                                <b>📍 آخرین خیابان:</b> <span style="color:#ffa042;">${lastStreet?.street || 'نامشخص'}</span>
                            </div>
                            <details style="font-size: 11px;">
                                <summary style="cursor: pointer; color: #ffa042;">📋 لیست خیابان‌های مسیر (${routeStreets.length} مرحله)</summary>
                                <div style="margin-top: 8px; max-height: 200px; overflow-y: auto;">
                                    ${routeStreets.map(s => `
                                        <div style="padding: 6px 0; border-bottom: 1px solid #444;">
                                            ${s.order}. <b>${s.street}</b><br/>
                                            <span style="font-size: 10px; color: #aaa;">
                                                ${(s.distance).toFixed(0)} متر • ${Math.floor(s.duration)} ثانیه
                                                ${s.maneuver === 'turn' ? ' ↪️ گردش' : s.maneuver === 'depart' ? ' 🚀 شروع' : s.maneuver === 'arrive' ? ' 🏁 پایان' : ' ➡️ ادامه'}
                                            </span>
                                        </div>
                                    `).join('')}
                                </div>
                            </details>
                        </div>
                    `;
                    showRoutePanel(panelHtml);
                }

                const routeGeometry = data.routes[0].geometry;
                if (map.getSource('route')) {
                    map.getSource('route').setData(routeGeometry);
                } else {
                    map.addSource('route', { type: 'geojson', data: routeGeometry });
                    map.addLayer({
                        id: 'route-line', type: 'line', source: 'route',
                        layout: { 'line-join': 'round', 'line-cap': 'round' },
                        paint: { 'line-color': '#0288d1', 'line-width': 6, 'line-opacity': 0.85 }
                    });
                }
                
                return { streets: routeStreets, lastStreet: lastStreet?.street, totalDistance: data.routes[0].distance, totalDuration: data.routes[0].duration };
            } catch (error) {
                console.error("خطا:", error);
                alert("امکان ارتباط با سرور مسیریابی وجود ندارد!");
                return null;
            }
        }

        function resetRouting() {
            startCoords = null; endCoords = null;
            if (startMarker) startMarker.remove();
            if (endMarker) endMarker.remove();
            if (map.getLayer('route-line')) map.removeLayer('route-line');
            if (map.getSource('route')) map.removeSource('route');
            removeRoutePanel();
        }

        map.on('click', async (e) => {
            const coords = [e.lngLat.lng, e.lngLat.lat];
            if (!startCoords) {
                startCoords = coords;
                startMarker = new maplibregl.Marker({ color: '#2e7d32' }).setLngLat(startCoords).addTo(map);
            } else if (!endCoords) {
                endCoords = coords;
                endMarker = new maplibregl.Marker({ color: '#d32f2f' }).setLngLat(endCoords).addTo(map);
                await calculateRoute(startCoords, endCoords, true);
            } else {
                resetRouting();
                startCoords = coords;
                startMarker = new maplibregl.Marker({ color: '#2e7d32' }).setLngLat(startCoords).addTo(map);
            }
        });

        // ==========================================
        // آدرس کلیک راست (متصل به پلتفرم پایتون - پورت 8000)
        // ==========================================
        const addressBox = document.getElementById('address-box');
        const addressText = document.getElementById('address-text');
        const addressCoords = document.getElementById('address-coords');

        map.on('contextmenu', async (e) => {
            e.preventDefault();
            const lng = e.lngLat.lng;
            const lat = e.lngLat.lat;
            
            addressBox.style.display = 'block';
            addressText.innerHTML = 'در حال دریافت آدرس...';
            addressCoords.innerHTML = `مختصات: ${lng.toFixed(6)} , ${lat.toFixed(6)}`;
            
            try {
                const reverseUrl = `http://127.0.0.1:8000/api/v1/reverse?lat=${lat}&lon=${lng}`;
                const reverseResponse = await fetch(reverseUrl);
                const data = await reverseResponse.json();
                
                if (!data || !data.address) {
                    addressText.innerHTML = 'آدرسی برای این نقطه یافت نشد.';
                    return;
                }
                
                let displayText = data.address;
                if (data.nearest_street && data.distance_to_street_meters !== null) {
                    displayText += `<br/><span style="font-size: 10px; color: #ffa042;">📍 نزدیک‌ترین معبر: ${data.nearest_street} (${data.distance_to_street_meters.toFixed(1)} متر)</span>`;
                }
                addressText.innerHTML = displayText;
                
            } catch (error) {
                console.error('خطا در آدرس‌یابی معکوس:', error);
                addressText.innerHTML = 'خطا در ارتباط با سرور آدرس‌یابی پایتون.';
            }
            
            setTimeout(() => {
                if (addressBox.style.display === 'block') addressBox.style.display = 'none';
            }, 10000);
        });

        // ==========================================
        // منطق دکمه‌های فیلتر سریع مکان‌ها (POI - پورت 8000)
        // ==========================================
        let poiMarkers = []; // آرایه برای ذخیره پین‌های آبی مکان‌های پیدا شده

        // شنود کلیک روی دکمه‌های فیلتر سریع در بالای نقشه
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const category = btn.getAttribute('data-category');
                
                // رفتار کلیک تکراری: اگر دکمه فعال دوباره کلیک شد، غیرفعال شود و پین‌ها پاک شوند
                if (btn.classList.contains('active')) {
                    btn.classList.remove('active');
                    clearPoiMarkers();
                    return;
                }

                // فعال کردن دکمه فیلتر کلیک شده و غیرفعال کردن بقیه دکمه‌ها
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // ۱. دریافت موقعیت فعلی مرکز نقشه کاربر
                const center = map.getCenter();

                try {
                    // ۲. استعلام زنده نزدیک‌ترین مکان‌ها از وب‌سرویس پایتون ( Fast API پورت 8000 )
                    // فیلتر ۵ کیلومتری با محدودیت دریافت ۱۵ نتیجه
                    const url = `http://127.0.0.1:8000/api/v1/pois/nearest?lat=${center.lat}&lon=${center.lng}&category=${category}&radius=5000&limit=15`;
                    const response = await fetch(url);
                    const data = await response.json();

                    // پاک کردن پین‌های آبی قدیمی از روی نقشه
                    clearPoiMarkers();

                    if (data.length === 0) {
                        alert("هیچ مکانی در محدوده ۵ کیلومتری این نقطه یافت نشد!");
                        return;
                    }

                    // ۳. رسم پین‌های آبی‌رنگ به همراه پاپ‌آپ‌های اطلاعات فارسی
                    data.forEach(item => {
                        // ساخت بدنه پاپ‌آپ فارسی با نام و فاصله دقیق به متر
                        const popup = new maplibregl.Popup({ offset: 25 })
                            .setHTML(`<b>${item.name}</b><br/><span style="font-size:10px; color:#ffa042;">📏 فاصله: ${item.distance_meters.toFixed(0)} متر</span>`);

                        // ایجاد پین آبی رنگ مخصوص POIها
                        const marker = new maplibregl.Marker({ color: '#1e88e5' }) // آبی
                            .setLngLat([item.lon, item.lat])
                            .setPopup(popup)
                            .addTo(map);

                        // ذخیره پین در آرایه برای پاکسازی در کلیک‌های بعدی
                        poiMarkers.push(marker);
                    });

                } catch (error) {
                    console.error("خطا در دریافت مکان‌ها از پایتون:", error);
                    alert("خطا در ارتباط با سرور دریافت مکان‌های نزدیک!");
                }
            });
        });

        // تابع کمکی پاک کردن پین‌های آبی مکان‌های قدیمی از روی نقشه
        function clearPoiMarkers() {
            poiMarkers.forEach(marker => marker.remove());
            poiMarkers = [];
        }
    </script>
</body>
</html>
