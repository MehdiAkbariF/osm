<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقشه اختصاصی ایران</title>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script>
        // ۱. فعال‌سازی چسبندگی حروف فارسی و نگارش راست‌به‌چپ (بسیار مهم)
        maplibregl.setRTLTextPlugin(
            'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.js',
            null,
            true
        );

        const map = new maplibregl.Map({
            container: 'map',
            center: [51.404, 35.715], // تهران
            zoom: 12,
            style: {
                "version": 8,
                "name": "Iran Custom Map",
                "glyphs": "http://localhost:3000/fonts/{fontstack}/{range}",
                "sources": {
                    "iran_lines": {
                        "type": "vector",
                        "tiles": ["http://localhost:3000/planet_osm_line/{z}/{x}/{y}"]
                    }
                },
                "layers": [
                    {
                        "id": "background",
                        "type": "background",
                        "paint": { "background-color": "#f5f3f0" }
                    },
                    // نمایش خیابان‌ها و اتوبان‌ها (فقط مواردی که تگ highway دارند جهت سرعت بیشتر)
                    {
                        "id": "roads",
                        "type": "line",
                        "source": "iran_lines",
                        "source-layer": "planet_osm_line",
                        "filter": ["has", "highway"], // فیلتر خطوط غیر جاده‌ای برای سبک شدن نقشه
                        "paint": {
                            "line-color": "#ffffff",
                            "line-width": 2
                        }
                    },
                    // رندر نام خیابان‌ها با فونت فارسی وزیر
                    {
                        "id": "road-labels",
                        "type": "symbol",
                        "source": "iran_lines",
                        "source-layer": "planet_osm_line",
                        "filter": ["has", "name"], // فقط جاده‌هایی که نام دارند
                        "layout": {
                            "text-field": ["get", "name"],
                            "text-font": ["Vazirmatn Thin"], // لود مستقیم فونت فارسی شما
                            "text-size": 11,
                            "symbol-placement": "line"
                        },
                        "paint": {
                            "text-color": "#222222",
                            "text-halo-color": "#ffffff",
                            "text-halo-width": 1.5
                        }
                    }
                ]
            }
        });

        map.addControl(new maplibregl.NavigationControl());
    </script>
</body>
</html>
