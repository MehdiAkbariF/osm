# =======================================================
# تنظیمات پایه و اتصال به دیتابیس
# =======================================================

# آدرس اتصال به پایگاه داده داکر (با پارامترهای اضافی برای کارایی بهتر)
postgres:
  connection_string: 'postgres://map_admin:map_secure_pass@localhost:5433/iran_map?connect_timeout=30&pool_size=20'
  # استفاده از اتصال دائمی (keepalive) برای جلوگیری از قطع و وصل شدن
  connection_timeout: 30
  pool_size: 20
  idle_timeout: 600

# =======================================================
# تنظیمات کش و حافظه
# =======================================================

# کش روی حافظه (RAM) برای سریع‌ترین دسترسی
cache:
  type: memory
  size_mb: 2048
  ttl_seconds: 3600  # کش تایل‌ها به مدت ۱ ساعت

# کش روی دیسک برای تایل‌های قدیمی (فال‌بک)
disk_cache:
  path: ./cache
  size_mb: 10240  # ۱۰ گیگابایت کش روی دیسک
  ttl_seconds: 86400  # ۲۴ ساعت

# =======================================================
# تنظیمات فشرده‌سازی تایل‌ها
# =======================================================

# فشرده‌سازی gzip برای کاهش حجم تایل‌های vector
preferred_encoding: gzip
compression_level: 6  # سطح فشرده‌سازی 1 (کمترین) تا 9 (بیشترین)

# =======================================================
# تنظیمات سرور وب
# =======================================================

listen:
  address: "0.0.0.0:3000"
  # محدودیت حجم درخواست (۱۰ مگابایت)
  max_request_body_size: 10485760
  # زمان timeout برای درخواست‌های طولانی
  request_timeout: 60

# =======================================================
# تنظیمات CORS برای دسترسی از فرانت‌اند
# =======================================================

cors:
  allow_origins:
    - "*"
  allow_methods:
    - "GET"
    - "POST"
    - "OPTIONS"
  allow_headers:
    - "Content-Type"
    - "Accept"
    - "Accept-Encoding"

# =======================================================
# تنظیمات منابع نقشه (تایل‌ها)
# =======================================================

tiles:
  # تنظیمات عمومی همه منابع
  defaults:
    minzoom: 0
    maxzoom: 14
    # حاشیه اطراف تایل برای جلوگیری از لبه‌های خالی
    buffer_size: 128
    # ساده‌سازی جئومتری برای کاهش حجم تایل
    simplify_geometry: true
    simplify_tolerance: 1.0
    # حداقل اندازه جئومتری برای نمایش
    min_geometry_size: 1.0
  
  sources:
    # منبع اصلی نقشه ایران
    iran_map:
      type: postgres
      uri: "postgresql://map_admin:map_secure_pass@localhost:5433/iran_map"
      minzoom: 0
      maxzoom: 14
      # فیلتر لایه‌ها بر اساس زوم (برای بهینه‌سازی)
      layers:
        - name: planet_osm_line
          minzoom: 8
          maxzoom: 14
          geometry_column: way
          geometry_type: LINESTRING
          properties:
            - name
            - highway
            - ref
            - oneway
            - bridge
            - tunnel
            - maxspeed
        - name: planet_osm_point
          minzoom: 10
          maxzoom: 14
          geometry_column: way
          geometry_type: POINT
          properties:
            - name
            - amenity
            - shop
            - tourism
            - addr:housenumber
            - addr:street
        - name: planet_osm_polygon
          minzoom: 8
          maxzoom: 14
          geometry_column: way
          geometry_type: POLYGON
          properties:
            - name
            - landuse
            - building
            - leisure
        - name: planet_osm_roads
          minzoom: 6
          maxzoom: 14
          geometry_column: way
          geometry_type: LINESTRING
          properties:
            - name
            - highway
            - ref
      
      # کوئری سفارشی برای جستجوی آدرس معکوس با دقت بالا
      functions:
        reverse_geocode:
          sql: |
            SELECT 
              name,
              highway,
              ST_Distance(way, ST_Transform(ST_SetSRID(ST_MakePoint($1, $2), 4326), 3857)) as distance
            FROM planet_osm_line
            WHERE highway IN ('primary', 'secondary', 'tertiary', 'residential', 'unclassified')
              AND name IS NOT NULL
              AND ST_DWithin(way, ST_Transform(ST_SetSRID(ST_MakePoint($1, $2), 4326), 3857), $3)
            ORDER BY 
              CASE 
                WHEN highway IN ('primary', 'secondary') THEN 1
                WHEN highway = 'tertiary' THEN 2
                ELSE 3
              END,
              distance ASC
            LIMIT 1

    # منبع نقاط آدرس (برای دقت بالای آدرس‌یابی)
    address_points:
      type: postgres
      uri: "postgresql://map_admin:map_secure_pass@localhost:5433/iran_map"
      minzoom: 12
      maxzoom: 14
      layers:
        - name: address_points
          sql: |
            SELECT 
              ST_Transform(way, 3857) as way,
              "addr:housenumber" as housenumber,
              "addr:street" as street,
              "addr:city" as city,
              "addr:postcode" as postcode
            FROM planet_osm_point
            WHERE "addr:housenumber" IS NOT NULL 
              AND "addr:street" IS NOT NULL
          geometry_column: way
          geometry_type: POINT
          properties:
            - housenumber
            - street
            - city
            - postcode

# =======================================================
# تنظیمات رابط وب مدیریت
# =======================================================

webui:
  enable: true
  path: /webui
  # صفحه اصلی دمو برای تست
  default_view: /webui/index.html

# =======================================================
# تنظیمات منابع PMTiles (برای داده‌های از پیش رندر شده)
# =======================================================

pmtiles:
  sources:
    # در صورت وجود فایل از پیش رندر شده
    # iran_basemap:
    #   path: ./basemap_iran.pmtiles
    #   minzoom: 0
    #   maxzoom: 14

# =======================================================
# تنظیمات آدرس دهی مسیرها (Routing)
# =======================================================

routing:
  enabled: false  # اگر مسیریابی نیاز ندارید
  # در صورت نیاز به مسیریابی:
  # data_path: ./osrm_data

# =======================================================
# تنظیمات آدرس فونت‌های فارسی
# =======================================================

fonts:
  - './fonts'
  - '/usr/share/fonts/truetype'
  
# =======================================================
# لاگینگ و اشکال‌زدایی
# =======================================================

logging:
  level: info  # debug, info, warn, error
  format: json
  output: stdout
  # ذخیره لاگ در فایل
  file:
    path: ./logs/martin.log
    max_size_mb: 100
    max_files: 5