# آدرس اتصال به پایگاه داده داکر
postgres:
  connection_string: 'postgres://map_admin:map_secure_pass@localhost:5433/iran_map'

# آدرس پوشه فونت‌های فارسی نقشه
fonts:
  - 'fonts'

# =======================================================
# بخش جدید: بهینه‌سازی لایه حافظه کش و فشرده‌سازی تایل‌ها
# =======================================================

# اختصاص ۲ گیگابایت رم برای کش کردن تایل‌های رندر شده نقشه ایران
# این کار سرعت لود بخش‌های پربازدید نقشه را به صدم ثانیه می‌رساند
cache_size_mb: 2048

# تنظیم فشرده‌سازی روی gzip برای کاهش مصرف پردازنده (CPU) سیستم شما
# (باعث می‌شود تایل‌ها بسیار سریع‌تر فشرده و به مرورگر ارسال شوند)
preferred_encoding: gzip